# Colombia Radar - Configuración de Fuentes de Recolección
# Regla 5: URLs e IDs no confirmados al 100% se marcan como VERIFICAR
 
user_agent: "ColombiaRadar/1.0 (+https://github.com/local/colombia-radar; herramienta educativa personal)"
default_min_delay: 1.0
 
# Configuración del enriquecimiento de artículos (Punto 2)
enriquecer:
  activo: true
  max_peticiones_por_ciclo: 10
  max_caracteres: 1500
 
# Cuántos artículos recientes mira cada análisis
analisis:
  max_articulos: 600
 
# Qué se publica en los JSON que lee la interfaz
publicacion:
  incluir_resumen: false   # false = solo enlace, titular, medio, fecha y certeza (sin texto de los medios)
  max_senales: 200
  max_puntos_serie: 30
 
# Configuración de detección de degradación en fuentes (Punto 6)
salud:
  max_corridas_vacias: 3      # Marcar 'degradada' si acumula N corridas consecutivas con 0 items
  umbral_caida_brusca: 0.5    # Caída al 50% o menos respecto al promedio histórico
 
