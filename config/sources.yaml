    peso: 1.0
    certeza: "confirmado"
    min_delay: 2.0
    # VERIFICAR: Endpoint público de consulta de información relevante de emisores RNVE
    url: "https://www.superfinanciera.gov.co/inicio/informacion-relevante-emisores"
    item_selector: "table.tabla-informacion-relevante tbody tr, .item-relevante"
    title_selector: ".asunto, td:nth-child(3) a, a"
    link_selector: "a"
    date_selector: ".fecha, td:nth-child(2)"
    emisor_selector: ".emisor, td:nth-child(1)"
 
